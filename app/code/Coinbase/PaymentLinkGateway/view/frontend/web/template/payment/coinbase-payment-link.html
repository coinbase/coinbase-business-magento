<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <img data-bind="attr: {src: getLogoUrl(), alt: getTitle()}"
                 class="payment-icon"
                 style="height: 24px; vertical-align: middle; margin-right: 8px;"/>
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>

    <div class="payment-method-content" data-bind="css: {'_active': (getCode() == isChecked())}">
        <!-- ko if: (getCode() == isChecked()) -->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion('messages') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
            <div class="checkout-agreements-block">
                <!-- ko foreach: $parent.getRegion('before-place-order') -->
                    <!-- ko template: getTemplate() --><!-- /ko -->
                <!-- /ko -->
            </div>
        </div>

        <div class="coinbase-payment-description" style="margin-bottom: 16px; padding: 12px; background: #f5f7fa; border-radius: 8px;">
            <p style="margin: 0 0 8px 0; font-size: 14px;" data-bind="text: getDescription()"></p>
            <p style="margin: 0; font-size: 13px; color: #666;">
                You will be redirected to Coinbase to complete your payment. After payment, you will be returned to this store.
            </p>
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Pay with Coinbase')}, enable: (getCode() == isChecked())"
                        disabled>
                    <span data-bind="i18n: 'Pay with Coinbase'"></span>
                </button>
            </div>
        </div>
        <!-- /ko -->
    </div>
</div>
